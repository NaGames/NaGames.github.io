name: Refresh Roblox data

# Pulls live thumbnails, visit counts and player counts from Roblox and
# commits them to data/roblox.json. Roblox blocks these calls from browsers
# (no CORS headers), so they have to happen here instead.

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "data/content.js"   # re-run whenever you add or change a game
      - "scripts/fetch-roblox.mjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch from Roblox
        run: node scripts/fetch-roblox.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/roblox.json; then
            echo "No change in Roblox data."
          else
            git add data/roblox.json
            git commit -m "chore: refresh Roblox stats and thumbnails"
            git push
          fi
