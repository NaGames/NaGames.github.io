<!--
  Deliberately self-contained: no external CSS, no JS, inline mascot.

  GitHub Pages serves this file for a miss at ANY path depth, so a relative
  href like "css/style.css" would resolve against the broken URL and fail.
  Inlining is the only thing guaranteed to render correctly everywhere.

  The nav links below are root-absolute. If you deploy to a PROJECT page
  (username.github.io/NaGamesWeb/) rather than a user page, prefix them with
  /NaGamesWeb - see the README.
-->
<style>
  :root {
    --bg: #0A0A0B; --gold: #D4A24C; --gold-bright: #E8C06A;
    --text: #F2EFE9; --muted: #9A958C; --border: rgba(212,162,76,0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; text-align: center;
    padding: 40px 16px;
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.65;
  }
  svg { width: 112px; height: 112px; margin: 0 auto 26px; display: block; }
  h1 {
    font-family: "Anton", "Arial Black", sans-serif; font-weight: 400;
    text-transform: uppercase; line-height: 0.95;
    font-size: clamp(3rem, 14vw, 6rem); margin: 0 0 4px; color: var(--gold);
  }
  h2 {
    font-family: "Anton", "Arial Black", sans-serif; font-weight: 400;
    text-transform: uppercase; font-size: clamp(1.3rem, 4vw, 1.9rem);
    margin: 0 0 14px;
  }
  p { color: var(--muted); max-width: 44ch; margin: 0 auto 30px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-flex; align-items: center; padding: 13px 24px;
    border-radius: 999px; font-weight: 700; font-size: 0.95rem;
    text-decoration: none; border: 1px solid transparent;
    transition: transform .18s, background .18s, border-color .18s;
  }
  a:hover { transform: translateY(-2px); }
  .primary { background: var(--gold); color: #0A0A0B; }
  .primary:hover { background: var(--gold-bright); }
  .ghost { border-color: var(--border); color: var(--gold); }
  .ghost:hover { background: rgba(212,162,76,0.08); }
  :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
