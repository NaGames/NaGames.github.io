<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- The title is replaced with the real game name by render.js once ?id= is read. -->
<title>Game - NaGames</title>
<meta name="description" content="Game details, codes and update history for a NaGames Roblox experience.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://nagames.github.io/game.html">
<meta property="og:title" content="Game - NaGames">
<meta property="og:description" content="Game details, codes and update history.">
<meta property="og:image" content="https://nagames.github.io/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script src="data/content.js" defer></script>
<script src="js/site.js" defer></script>
<script src="js/roblox.js" defer></script>
<script src="js/render.js" defer></script>
</head>
<body>

<div id="site-header"></div>

<!-- Filled entirely by the "game-detail" renderer. An unknown or missing
     ?id= redirects to games.html rather than rendering an empty page. -->
<main id="main" data-render="game-detail"></main>

<div id="site-footer"></div>

</body>
</html>
